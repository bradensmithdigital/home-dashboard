<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1433">
<title>Home Routines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<script>
/* ====== OPTIONAL: hard-code settings here ======
   You can also set these on the tablet with the Settings button. */
const DEFAULTS = {
  token: "",   // your Voice Monkey API token
  devices: {}  // device IDs; leave empty and fill them in via Settings
};
</script>
<style>
/*
VOICE: calm, soft, readable in a dark room at 2am
IDEA: a house control panel: a home screen of rooms, each room its own page
PICTURE: big room tiles on the home page; fixture rows on each room page
COLOUR and TYPE: night navy; gold ON, amber DIM, slate OFF, teal fan; Nunito
LAYOUT: home = grid of room tiles; room = big Back button + title, then rows; status/tools at the bottom
*/
:root{
  --bg:#0b1433; --bg2:#121d47; --card:rgba(255,255,255,.04); --line:rgba(255,255,255,.10);
  --ink:#eef0ff; --muted:#9aa3d0; --gold:#f6c96b; --ok:#7ee0b5; --err:#ff8a80;
  color-scheme:dark;
}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:radial-gradient(120% 70% at 50% 0%,#1a2766 0%,var(--bg) 60%) fixed;color:var(--ink);
  font:17px/1.4 Nunito,system-ui,sans-serif;user-select:none;-webkit-user-select:none;overflow-x:clip;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.app{max-width:720px;min-height:100vh;margin:0 auto;padding:clamp(12px,2.5vw,32px);display:grid;grid-template-rows:1fr auto;gap:clamp(16px,2.5vw,28px)}

/* bottom bar */
.bar{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:clamp(14px,2vw,20px);margin-top:clamp(8px,2vh,24px)}
.icon-btn.small{min-height:38px;padding:0 13px;font-size:13px;gap:6px;color:var(--muted);background:transparent}
.icon-btn.small svg{width:16px;height:16px}
.icon-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:var(--ink);border-radius:999px;
  min-height:44px;padding:0 16px;font:inherit;font-size:15px;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.icon-btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.icon-btn svg{width:20px;height:20px}

/* home page */
.home{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(10px,2vw,16px);align-content:start}
.tile{border:0;border-radius:28px;cursor:pointer;color:var(--ink);font:inherit;font-weight:800;font-size:clamp(22px,2.8vw,32px);line-height:1.1;
  display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:18px;min-height:96px;padding:14px 24px;text-align:left;
  background:linear-gradient(160deg,var(--c2),var(--c1));
  box-shadow:0 1px 0 rgba(255,255,255,.16) inset,0 18px 36px -18px var(--glow),0 4px 0 rgba(0,0,0,.25);transition:transform .12s ease}
.tile:active{transform:scale(.97)}
.tile:focus-visible{outline:4px solid var(--gold);outline-offset:4px}
.tile svg{width:56px;flex:none;height:auto;filter:drop-shadow(0 0 14px var(--glow))}
.tile small{font-size:14px;font-weight:600;color:rgba(238,240,255,.7)}
.r-master{--c1:#2b2a6b;--c2:#4a3f9e;--glow:#b6a6ff}
.r-grayson{--c1:#0f3e4a;--c2:#1d6a78;--glow:#7fd8e6}
.r-dining{--c1:#5a2a1c;--c2:#93492a;--glow:#ffa77a}
.r-living{--c1:#5a1f3e;--c2:#8e3564;--glow:#f2b8d0}
.r-outside{--c1:#173d2c;--c2:#2a6a48;--glow:#7fd08a}
.r-garage{--c1:#262a3a;--c2:#40465e;--glow:#a9b0cc}
.r-office{--c1:#5a3d0c;--c2:#9a6a14;--glow:#ffd36b}
.r-whole{--c1:#152559;--c2:#24418f;--glow:#f6c96b}

/* room page */
.room{display:grid;gap:clamp(14px,2vw,24px);align-content:start}
.room-head{display:flex;align-items:center;gap:clamp(12px,2vw,24px)}
.back{border:0;border-radius:22px;min-height:clamp(72px,10vh,96px);min-width:clamp(150px,18vw,210px);padding:0 24px;cursor:pointer;
  background:rgba(255,255,255,.1);color:var(--ink);font:inherit;font-weight:800;font-size:clamp(22px,2.6vw,30px);
  display:inline-flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 1px 0 rgba(255,255,255,.14) inset,0 3px 0 rgba(0,0,0,.25)}
.back:active{transform:scale(.97)}
.back:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.back svg{width:30px;height:30px}
.room-head h1{margin:0;font-size:clamp(28px,4vw,48px);line-height:1.05;text-wrap:balance}
@media (max-width:520px){.room-head{flex-direction:column;align-items:stretch}.back{width:100%}}

section{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:clamp(16px,2.5vw,28px)}
.empty{color:var(--muted);font-size:19px;text-align:center;padding:clamp(30px,8vh,80px) 16px}
.rows{display:grid;gap:clamp(10px,1.6vw,16px)}
.row{display:grid;grid-template-columns:minmax(0,1fr);align-items:center;gap:clamp(10px,2vw,20px)}
.row+.row{border-top:1px solid var(--line);padding-top:clamp(10px,1.6vw,16px)}
.rname{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
.rname svg{width:30px;height:30px;flex:none}
.btns{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(8px,1.4vw,14px)}

.btn{position:relative;border:0;border-radius:20px;min-height:72px;padding:10px 24px;text-align:left;cursor:pointer;
  color:var(--ink);font:inherit;font-weight:800;font-size:clamp(18px,2.1vw,24px);letter-spacing:.03em;line-height:1.1;
  background:linear-gradient(160deg,var(--c2),var(--c1));
  box-shadow:0 1px 0 rgba(255,255,255,.16) inset,0 14px 30px -16px var(--glow),0 3px 0 rgba(0,0,0,.25);transition:transform .12s ease,filter .2s}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.btn .state{position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:15px;font-weight:600;letter-spacing:0;color:rgba(238,240,255,.75);min-height:1.2em}
.btn.busy{filter:saturate(.7) brightness(.9)}
.btn.ok{box-shadow:0 0 0 3px var(--ok) inset}
.btn.ok .state{color:var(--ok)} .btn.err .state{color:var(--err)}
.on {--c1:#7a4f12;--c2:#c08a2a;--glow:#f6c96b}
.hol{--c1:#6e1a22;--c2:#1f6a3a;--glow:#ff6b6b}
.movie{--c1:#2a1752;--c2:#4b2a8a;--glow:#b18cff}
.tvon{--c1:#1a3270;--c2:#2d55b0;--glow:#9fb4ff}
.dim{--c1:#4a2f1a;--c2:#7a4c24;--glow:#ffa94d}
.off{--c1:#1a1f3d;--c2:#2e3560;--glow:#8a93c4}
.fan1{--c1:#103a3f;--c2:#1c5a5f;--glow:#5fd0c8}
.fan2{--c1:#11494f;--c2:#227078;--glow:#5fd0c8}
.fan3{--c1:#135a62;--c2:#2a8a92;--glow:#5fd0c8}

.big{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(10px,2vw,20px)}
.big .btn{min-height:120px;font-size:clamp(26px,6vw,36px);display:flex;align-items:center;justify-content:flex-start;gap:18px}
.big .btn svg{width:56px;flex:none;height:auto;filter:drop-shadow(0 0 14px var(--glow))}
.bedtime{--c1:#2b2a6b;--c2:#4a3f9e;--glow:#b6a6ff}
.goodnight{--c1:#152559;--c2:#24418f;--glow:#f6c96b}

/* settings */
.sheet{position:fixed;inset:0;background:rgba(5,8,25,.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.sheet.open{display:flex}
.panel{background:var(--bg2);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:clamp(18px,3vw,32px);width:min(620px,100%);max-height:92vh;overflow:auto;user-select:text;-webkit-user-select:text}
.panel h2{margin:0 0 6px;font-size:26px}
.panel h3{margin:22px 0 0;font-size:17px;color:var(--gold)}
.panel p{margin:0 0 12px;color:var(--muted);font-size:15px}
.panel label{display:block;font-weight:600;font-size:15px;margin:12px 0 6px}
.panel input{width:100%;min-height:48px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:#0b1433;color:var(--ink);font:16px Nunito,system-ui,sans-serif;padding:0 14px}
.panel textarea{width:100%;min-height:120px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:#0b1433;color:var(--ink);font:14px/1.4 ui-monospace,Menlo,monospace;padding:12px 14px;resize:vertical;word-break:break-all}
.panel textarea:focus,.panel input:focus{outline:3px solid var(--gold);outline-offset:1px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap;position:sticky;bottom:-1px;background:var(--bg2);padding-top:10px}
.primary{background:var(--gold);color:#1a1300;border-color:transparent;font-weight:800}
.warn{color:var(--gold);font-size:14px;margin-top:10px}
@media (prefers-reduced-motion:reduce){.btn,.tile{transition:none}}
</style>
</head>
<body>
<div class="app">
  <main id="view"></main>
  <footer class="bar" aria-label="Dashboard tools">
    <button class="icon-btn small" id="gearBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Settings</button>
    <button class="icon-btn small" id="exportBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M5 15v5h14v-5"/></svg>Export</button>
    <button class="icon-btn small" id="importBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 15v5h14v-5"/></svg>Import</button>
    <button class="icon-btn small" id="fsBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Full screen</button>
  </footer>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <form class="panel" id="setForm">
    <h2 id="setTitle">Voice Monkey settings</h2>
    <p>Your token is in the Voice Monkey console under API Tokens. Each device ID is shown on the Routine Trigger device you made for that button. Saved on this tablet only.</p>
    <label for="token">API token</label>
    <input id="token" type="password" autocomplete="off" spellcheck="false">
    <div id="devFields"></div>
    <div class="warn" id="setWarn"></div>
    <div class="actions">
      <button type="button" class="icon-btn" id="cancelBtn">Cancel</button>
      <button type="submit" class="icon-btn primary">Save</button>
    </div>
  </form>
</div>

<div class="sheet" id="xfer" role="dialog" aria-modal="true" aria-labelledby="xTitle">
  <form class="panel" id="xForm">
    <h2 id="xTitle">Export</h2>
    <p id="xText"></p>
    <label for="xCode" id="xLabel">Settings code</label>
    <textarea id="xCode" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
    <div class="warn" id="xWarn"></div>
    <div class="actions">
      <button type="button" class="icon-btn" id="xClose">Close</button>
      <button type="submit" class="icon-btn primary" id="xAction">Copy</button>
    </div>
  </form>
</div>

<script>
{

  const ICON = {

    night:'<svg viewBox="0 0 32 32"><ellipse cx="16" cy="14" rx="8" ry="9" fill="#ffd08a"/><rect x="11" y="22" width="10" height="3" rx="1" fill="#c98a4a"/><rect x="10" y="25" width="12" height="3" rx="1.5" fill="#8a5a30"/></svg>',

      { name:"All lights", icon:"bulb", btns:[
        {key:"grAllOn", label:"ON", cls:"on"}, {key:"grAllDim", label:"DIM", cls:"dim"}, {key:"grAllOff", label:"OFF", cls:"off"}]},
      { name:"Fan", icon:"fan", btns:[
        {key:"grFanLow", label:"LOW", cls:"fan1"}, {key:"grFanMed", label:"MEDIUM", cls:"fan2"},
        {key:"grFanHigh", label:"HIGH", cls:"fan3"}, {key:"grFanOff", label:"OFF", cls:"off"}]},
      { name:"Night light", icon:"night", btns:[
        {key:"grNightOn", label:"ON", cls:"on"}, {key:"grNightOff", label:"OFF", cls:"off"}]}
    ]},
    { id:"garage",          title:"Garage",          icon:"garage", cls:"r-garage", rows:[
      { name:"All lights", icon:"bulb", btns:[
        {key:"gaAllOn", label:"ON", cls:"on"}, {key:"gaAllOff", label:"OFF", cls:"off"}]}
    ]},
    { id:"upstairs-office", title:"Upstairs Office", icon:"desk",   cls:"r-office", rows:[
      { name:"All lights", icon:"bulb", btns:[
        {key:"ofAllOn", label:"ON", cls:"on"}, {key:"ofAllOff", label:"OFF", cls:"off"}]},
      { name:"Desk lights", icon:"lamp", btns:[
        {key:"ofDeskOn", label:"ON", cls:"on"}, {key:"ofDeskOff", label:"OFF", cls:"off"}]}
    ]},
    { id:"outside",         title:"Outside",         icon:"tree",   cls:"r-outside" }
  ];

  // key -> spoken-style full name, e.g. "Master Bedroom Fan HIGH"
  const NAMES = {};
  const roomBtns = r => r.rows ? r.rows.flatMap(x => x.btns) : (r.big || []);
  ROOMS.forEach(r => {
    (r.rows || []).forEach(x => x.btns.forEach(b => { NAMES[b.key] = `${r.title} ${x.name} ${b.label}`; }));
    (r.big || []).forEach(b => { NAMES[b.key] = b.label; });
  });

  const STORE = "vm-routines-settings";
  const load = () => {
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(STORE) || "{}"); } catch (e) {}
    return { token: saved.token || DEFAULTS.token, devices: Object.assign({}, DEFAULTS.devices, saved.devices || {}) };
  };
  let cfg = load();
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify(cfg)); } catch (e) {} };
  const $ = id => document.getElementById(id);
  const view = $("view");

  // ---------- Views ----------
  const btnHTML = b => `<button class="btn ${b.cls}" data-key="${b.key}" aria-label="${NAMES[b.key]}">${b.icon ? ICON[b.icon] : ""}<span>${b.label}</span><span class="state"></span></button>`;

  function homeHTML() {
    return `<h1 style="position:absolute;left:-9999px">Home</h1><div class="home">${ROOMS.map(r =>
      `<button class="tile ${r.cls}" data-room="${r.id}">${ICON[r.icon]}<span>${r.title}</span></button>`
    ).join("")}</div>`;
  }
  function roomHTML(r) {
    let body;
    if (r.rows) body = `<section><div class="rows">${r.rows.map(x => `<div class="row">
        <div class="rname">${ICON[x.icon]}${x.name}</div>
        <div class="btns n${x.btns.length}" style="--n:${x.btns.length}">${x.btns.map(btnHTML).join("")}</div></div>`).join("")}</div></section>`;
    else if (r.big) body = `<div class="big">${r.big.map(btnHTML).join("")}</div>`;
    else body = `<section class="empty">No buttons in ${r.title} yet.</section>`;
    return `<div class="room"><div class="room-head">
      <button class="back" id="backBtn" aria-label="Back to home">${ICON.back}Back</button>
      <h1>${r.title}</h1></div>${body}</div>`;
  }
  function render() {
    const id = location.hash.slice(1);
    const room = ROOMS.find(r => r.id === id);
    view.innerHTML = room ? roomHTML(room) : homeHTML();
    window.scrollTo(0, 0);
  }
  const goHome = () => {
    if (!location.hash) return;
    try { history.pushState(null, "", location.pathname + location.search); render(); }
    catch (e) { location.hash = ""; }
  };
  window.addEventListener("hashchange", render);
  window.addEventListener("popstate", render);

  // ---------- Trigger ----------
  const cooldown = {};
  async function run(btn) {
    const key = btn.dataset.key, name = NAMES[key], st = btn.querySelector(".state");
    if (!cfg.token) { openSettings("Add your Voice Monkey token first."); return; }
    if (!cfg.devices[key]) { openSettings(`Add the device ID for ${name}.`, key); return; }
    if (cooldown[key]) return;
    cooldown[key] = true;
    btn.classList.remove("ok","err"); btn.classList.add("busy");
    st.textContent = "Sending…";
    const url = `${API}?token=${encodeURIComponent(cfg.token)}&device=${encodeURIComponent(cfg.devices[key])}`;
    try {
      await fetch(url, { method:"GET", mode:"no-cors", cache:"no-store" }); // reply is hidden; request still goes through
      btn.classList.add("ok"); st.textContent = "Sent ✓";
    } catch (e) {
      btn.classList.add("err"); st.textContent = "No connection";
    }
    btn.classList.remove("busy");
    setTimeout(() => { cooldown[key] = false; if (btn.isConnected) { btn.classList.remove("ok","err"); st.textContent = ""; } }, 3000);
  }

  view.addEventListener("click", e => {
    const tile = e.target.closest(".tile");
    if (tile) { location.hash = tile.dataset.room; return; }
    if (e.target.closest("#backBtn")) { goHome(); return; }
    const b = e.target.closest(".btn");
    if (b) run(b);
  });

  // ---------- Settings ----------
  $("devFields").innerHTML = ROOMS.filter(r => roomBtns(r).length).map(r => `<h3>${r.title}</h3>` +
    roomBtns(r).map(b => `<label for="dev-${b.key}">${NAMES[b.key]}</label>
      <input id="dev-${b.key}" autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="Device ID">`).join("")
  ).join("");
  function openSettings(msg, focusKey) {
    $("token").value = cfg.token;
    Object.keys(NAMES).forEach(k => { $("dev-" + k).value = cfg.devices[k] || ""; });
    $("setWarn").textContent = msg || "";
    $("sheet").classList.add("open");
    const f = focusKey && cfg.token ? $("dev-" + focusKey) : $("token");
    f.focus(); f.scrollIntoView({block:"center"});
  }
  const close = () => $("sheet").classList.remove("open");
  $("gearBtn").addEventListener("click", () => openSettings());
  $("cancelBtn").addEventListener("click", close);
  $("sheet").addEventListener("click", e => { if (e.target.id === "sheet") close(); });
  $("setForm").addEventListener("submit", e => {
    e.preventDefault();
    cfg.token = $("token").value.trim();
    Object.keys(NAMES).forEach(k => { cfg.devices[k] = $("dev-" + k).value.trim(); });
    save(); close();
  });

  // ---------- Export / Import ----------
  const PREFIX = "HOMEDASH1:";
  let xMode = "export";
  const encode = obj => PREFIX + btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
  const decode = str => {
    const s = str.trim().replace(/\s+/g, "");
    if (!s.startsWith(PREFIX)) throw new Error("That doesn't look like a dashboard settings code.");
    const data = JSON.parse(decodeURIComponent(escape(atob(s.slice(PREFIX.length)))));
    if (typeof data !== "object" || data === null || typeof (data.devices || {}) !== "object") throw new Error("That code is damaged.");
    return { token: typeof data.token === "string" ? data.token : "", devices: data.devices || {} };
  };
  function openXfer(mode) {
    xMode = mode;
    const code = $("xCode");
    $("xWarn").textContent = "";
    if (mode === "export") {
      $("xTitle").textContent = "Export settings";
      $("xText").textContent = "Copy this code and send it privately (a text to family is fine). It includes your Voice Monkey token, so don't post it anywhere public. On the other device, tap Import and paste it.";
      code.readOnly = true;
      code.value = encode({ token: cfg.token, devices: cfg.devices });
      $("xAction").textContent = "Copy code";
    } else {
      $("xTitle").textContent = "Import settings";
      $("xText").textContent = "Paste the settings code from another device. This replaces the token and device IDs on this device.";
      code.readOnly = false;
      code.value = "";
      $("xAction").textContent = "Import";
    }
    $("xfer").classList.add("open");
    if (mode === "import") code.focus();
  }
  const closeX = () => $("xfer").classList.remove("open");
  $("exportBtn").addEventListener("click", () => {
    if (!cfg.token && !Object.values(cfg.devices).some(Boolean)) { openSettings("Nothing to export yet. Fill in your settings first."); return; }
    openXfer("export");
  });
  $("importBtn").addEventListener("click", () => openXfer("import"));
  $("xClose").addEventListener("click", closeX);
  $("xfer").addEventListener("click", e => { if (e.target.id === "xfer") closeX(); });
  $("xForm").addEventListener("submit", async e => {
    e.preventDefault();
    const code = $("xCode");
    if (xMode === "export") {
      try { await navigator.clipboard.writeText(code.value); $("xWarn").textContent = "Copied ✓"; }
      catch (err) {
        code.select();
        try { document.execCommand("copy"); $("xWarn").textContent = "Copied ✓"; }
        catch (err2) { $("xWarn").textContent = "Couldn't copy automatically. Press and hold the code to copy it."; }
      }
    } else {
      try {
        const data = decode(code.value);
        cfg = { token: data.token, devices: Object.assign({}, data.devices) };
        save();
        $("xWarn").textContent = "Imported ✓";
        setTimeout(closeX, 900);
      } catch (err) {
        $("xWarn").textContent = err.message && !/JSON|atob|URI|character/i.test(err.message) ? err.message : "That code didn't work. Make sure you copied the whole thing.";
      }
    }
  });

  // ---------- Full screen + keep screen awake ----------
  $("fsBtn").addEventListener("click", async () => {
    try {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    } catch (e) {}
  });
  const wake = async () => { try { if ("wakeLock" in navigator) await navigator.wakeLock.request("screen"); } catch (e) {} };
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") wake(); });
  wake();

  render();
}
</script>
</body>
</html>
